name: Template

# Bake the template and run every check in the generated projects.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0  # copier renders from git

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.23"  # keep equal to uv_version in copier.yml

      - name: Install just
        run: uv tool install rust-just

      - name: Bake and check
        run: just test
